[workspace]
members = [
  ".",
  "src-tauri",
  "crates/everything-core",
  "crates/windows-shell",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[package]
name = "everything-modern-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
console_error_panic_hook = "0.1"
everything-core = { path = "crates/everything-core" }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Document",
  "console",
  "DomRect",
  "DomRectReadOnly",
  "Element",
  "Event",
  "EventTarget",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "PointerEvent",
  "Storage",
  "Window",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
