name: Generate icon assets

on:
  push:
    paths:
      - assets/icon.svg
      - scripts/generate-icons.ps1
      - .github/workflows/generate-icons.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate PNG and ICO files
        shell: powershell
        run: ./scripts/generate-icons.ps1

      - name: Commit generated assets
        shell: powershell
        run: |
          $changes = git status --porcelain -- assets/icon.png src-tauri/icons
          if ([string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
            Write-Host "Icon assets are already current."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png src-tauri/icons
          git commit -m "chore: generate icon assets"
          git push
