name: Complete Everything Next rename

on:
  push:
    branches:
      - chore/rename-everything-next

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/rename-everything-next
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Replace all legacy identifiers
        shell: python
        run: |
          import pathlib
          import subprocess

          replacements = (
              ("Everything Modern", "Everything Next"),
              ("EverythingModern", "EverythingNext"),
              ("everything-modern", "everything-next"),
              ("everything_modern", "everything_next"),
          )

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode())
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")

      - name: Regenerate Cargo lockfile
        run: cargo generate-lockfile

      - name: Remove one-shot workflow
        run: git rm .github/workflows/rename-everything-next.yml

      - name: Commit complete rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete Everything Next rename"
          git push origin HEAD:chore/rename-everything-next
