name: Complete Everything Next rename

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rename-everything-next
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Replace every legacy identifier
        shell: python
        run: |
          import pathlib, subprocess
          workflow_directory = pathlib.Path(".github/workflows")
          replacements = (
              ("Everything Modern", "Everything Next"),
              ("EverythingModern", "EverythingNext"),
              ("everything-modern", "everything-next"),
              ("everything_modern", "everything_next"),
          )
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              if workflow_directory in path.parents:
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              if after != before:
                  path.write_text(after, encoding="utf-8", newline="")
      - run: cargo generate-lockfile
      - name: Commit generated rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete Everything Next rename"
          git push origin HEAD:chore/rename-everything-next
