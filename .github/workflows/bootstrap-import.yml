name: Bootstrap project import

on:
  push:
    branches: [master]
    paths:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-project-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/everything-modern.zip.b64
          base64 --decode /tmp/everything-modern.zip.b64 > /tmp/everything-modern.zip
          echo "655920a39e6b2d2322f69b65667caae6392df8e4d25bf9c05c55aa374f9cff43  /tmp/everything-modern.zip" | sha256sum --check --strict
          unzip -t /tmp/everything-modern.zip

      - name: Import project without modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/everything-modern-import
          mkdir -p /tmp/everything-modern-import
          unzip -q /tmp/everything-modern.zip -d /tmp/everything-modern-import
          test -f /tmp/everything-modern-import/everything-modern/Cargo.toml
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/everything-modern-import/everything-modern/ ./
          rm -rf .bootstrap

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "feat: import Everything Modern project"
          git push origin HEAD:master
