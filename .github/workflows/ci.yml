name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk and Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.0

      - name: Validate workspace
        shell: pwsh
        run: .\scripts\check.ps1 -InstallSdk -InstallRuntime

      - name: Build NSIS installer
        shell: pwsh
        run: .\scripts\build.ps1 -SkipChecks

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: everything-modern-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
