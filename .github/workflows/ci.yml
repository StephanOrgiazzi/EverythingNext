name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        shell: pwsh
        run: cargo install trunk --version "0.21.14" --locked

      - name: Install Everything SDK3
        shell: pwsh
        run: .\scripts\install-everything-sdk.ps1

      - name: Validate workspace
        shell: pwsh
        run: .\scripts\check.ps1
