name: Apply SDK3 viewport fix

on:
  push:
    branches: [feat/everything-1.5-sdk3]
    paths: [.github/workflows/fix-sdk3-viewport.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/everything-1.5-sdk3
      - name: Patch SDK3 viewport handling
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/everything-core/src/sdk.rs")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'type SetSearchViewport = unsafe extern "system" fn(*mut c_void, usize) -> i32;\n',
                  'type SetSearchViewport = unsafe extern "system" fn(*mut c_void, usize) -> i32;\n'
                  'type GetSearchViewport = unsafe extern "system" fn(*mut c_void) -> usize;\n',
              ),
              (
                  '    set_search_viewport_offset: SetSearchViewport,\n'
                  '    set_search_viewport_count: SetSearchViewport,\n',
                  '    set_search_viewport_offset: SetSearchViewport,\n'
                  '    set_search_viewport_count: SetSearchViewport,\n'
                  '    get_search_viewport_offset: GetSearchViewport,\n'
                  '    get_search_viewport_count: GetSearchViewport,\n',
              ),
              (
                  '        let set_search_viewport_count =\n'
                  '            symbol!("Everything3_SetSearchViewportCount", SetSearchViewport);\n'
                  '        let search = symbol!("Everything3_Search", Search);\n',
                  '        let set_search_viewport_count =\n'
                  '            symbol!("Everything3_SetSearchViewportCount", SetSearchViewport);\n'
                  '        let get_search_viewport_offset = symbol!(\n'
                  '            "Everything3_GetSearchViewportOffset",\n'
                  '            GetSearchViewport\n'
                  '        );\n'
                  '        let get_search_viewport_count = symbol!(\n'
                  '            "Everything3_GetSearchViewportCount",\n'
                  '            GetSearchViewport\n'
                  '        );\n'
                  '        let search = symbol!("Everything3_Search", Search);\n',
              ),
              (
                  '            set_search_viewport_offset,\n'
                  '            set_search_viewport_count,\n'
                  '            search,\n',
                  '            set_search_viewport_offset,\n'
                  '            set_search_viewport_count,\n'
                  '            get_search_viewport_offset,\n'
                  '            get_search_viewport_count,\n'
                  '            search,\n',
              ),
              (
                  '        self.check_call(\n'
                  '            "Everything3_SetSearchViewportOffset",\n'
                  '            unsafe {\n'
                  '                (self.set_search_viewport_offset)(search_state.pointer, request.offset as usize)\n'
                  '            },\n'
                  '        )?;\n'
                  '        self.check_call(\n'
                  '            "Everything3_SetSearchViewportCount",\n'
                  '            unsafe {\n'
                  '                (self.set_search_viewport_count)(\n'
                  '                    search_state.pointer,\n'
                  '                    request.limit.clamp(1, 4096) as usize,\n'
                  '                )\n'
                  '            },\n'
                  '        )?;\n',
                  '        self.set_search_viewport(\n'
                  '            "Everything3_SetSearchViewportOffset",\n'
                  '            self.set_search_viewport_offset,\n'
                  '            self.get_search_viewport_offset,\n'
                  '            search_state.pointer,\n'
                  '            request.offset as usize,\n'
                  '        )?;\n'
                  '        self.set_search_viewport(\n'
                  '            "Everything3_SetSearchViewportCount",\n'
                  '            self.set_search_viewport_count,\n'
                  '            self.get_search_viewport_count,\n'
                  '            search_state.pointer,\n'
                  '            request.limit.clamp(1, 4096) as usize,\n'
                  '        )?;\n',
              ),
              (
                  '    fn check_call(&self, operation: &\'static str, succeeded: i32) -> Result<(), EngineError> {\n',
                  '    fn set_search_viewport(\n'
                  '        &self,\n'
                  '        operation: &\'static str,\n'
                  '        setter: SetSearchViewport,\n'
                  '        getter: GetSearchViewport,\n'
                  '        search_state: *mut c_void,\n'
                  '        value: usize,\n'
                  '    ) -> Result<(), EngineError> {\n'
                  '        // SDK3 3.0.0.9 applies these values but mistakenly always returns FALSE.\n'
                  '        // Read the value back instead of trusting the broken return value.\n'
                  '        unsafe { setter(search_state, value) };\n'
                  '        let actual = unsafe { getter(search_state) };\n'
                  '        if actual == value {\n'
                  '            Ok(())\n'
                  '        } else {\n'
                  '            Err(self.call_error(operation))\n'
                  '        }\n'
                  '    }\n'
                  '\n'
                  '    fn check_call(&self, operation: &\'static str, succeeded: i32) -> Result<(), EngineError> {\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/fix-sdk3-viewport.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/everything-core/src/sdk.rs .github/workflows/fix-sdk3-viewport.yml
          git commit -m "fix: handle SDK3 viewport setter return bug"
          git push origin HEAD:feat/everything-1.5-sdk3
