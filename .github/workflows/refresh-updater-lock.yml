name: Refresh updater lockfile

on:
  push:
    branches:
      - feat/auto-updater

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-updater
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo.lock without unrelated upgrades
        shell: bash
        run: |
          git checkout origin/master -- Cargo.lock
          cargo fetch --target x86_64-pc-windows-msvc

      - name: Commit Cargo.lock
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update lockfile for updater"
          git push
