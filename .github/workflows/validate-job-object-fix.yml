name: Validate job object fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rename-everything-next
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p everything-core --locked
