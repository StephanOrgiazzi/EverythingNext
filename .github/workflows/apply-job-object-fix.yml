name: Apply job object fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rename-everything-next
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Attach the bundled engine to a kill-on-close job
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/everything-core/src/bundled_engine.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "use std::collections::HashSet;\nuse std::env;\nuse std::fs;\nuse std::os::windows::process::CommandExt;\n",
              "use std::collections::HashSet;\nuse std::env;\nuse std::ffi::c_void;\nuse std::fs;\nuse std::os::windows::io::{AsRawHandle, FromRawHandle, OwnedHandle};\nuse std::os::windows::process::CommandExt;\n",
          )

          replace_once(
              "const CREATE_NO_WINDOW: u32 = 0x0800_0000;\nconst DEFAULT_INSTANCE_NAME: &str = \"\";\nconst DEFAULT_SERVICE_INSTANCE_NAME: &str = \"EverythingNext\";\n",
              "const CREATE_NO_WINDOW: u32 = 0x0800_0000;\nconst JOB_OBJECT_EXTENDED_LIMIT_INFORMATION_CLASS: i32 = 9;\nconst JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE: u32 = 0x0000_2000;\nconst DEFAULT_INSTANCE_NAME: &str = \"\";\nconst DEFAULT_SERVICE_INSTANCE_NAME: &str = \"EverythingNext\";\n",
          )

          replace_once(
              "#[link(name = \"kernel32\")]\nextern \"system\" {\n    fn WaitNamedPipeW(name: *const u16, timeout: u32) -> i32;\n}\n\npub(crate) struct ManagedEngine {\n    executable: PathBuf,\n    instance_name: String,\n    child: Option<Child>,\n}\n",
              "#[link(name = \"kernel32\")]\nextern \"system\" {\n    fn WaitNamedPipeW(name: *const u16, timeout: u32) -> i32;\n    fn CreateJobObjectW(attributes: *const c_void, name: *const u16) -> *mut c_void;\n    fn SetInformationJobObject(\n        job: *mut c_void,\n        information_class: i32,\n        information: *const c_void,\n        information_length: u32,\n    ) -> i32;\n    fn AssignProcessToJobObject(job: *mut c_void, process: *mut c_void) -> i32;\n}\n\n#[repr(C)]\nstruct JobObjectBasicLimitInformation {\n    per_process_user_time_limit: i64,\n    per_job_user_time_limit: i64,\n    limit_flags: u32,\n    minimum_working_set_size: usize,\n    maximum_working_set_size: usize,\n    active_process_limit: u32,\n    affinity: usize,\n    priority_class: u32,\n    scheduling_class: u32,\n}\n\n#[repr(C)]\nstruct IoCounters {\n    read_operation_count: u64,\n    write_operation_count: u64,\n    other_operation_count: u64,\n    read_transfer_count: u64,\n    write_transfer_count: u64,\n    other_transfer_count: u64,\n}\n\n#[repr(C)]\nstruct JobObjectExtendedLimitInformation {\n    basic_limit_information: JobObjectBasicLimitInformation,\n    io_info: IoCounters,\n    process_memory_limit: usize,\n    job_memory_limit: usize,\n    peak_process_memory_used: usize,\n    peak_job_memory_used: usize,\n}\n\nstruct JobObject {\n    handle: OwnedHandle,\n}\n\nimpl JobObject {\n    fn kill_on_close() -> Result<Self, EngineError> {\n        let raw_handle = unsafe { CreateJobObjectW(std::ptr::null(), std::ptr::null()) };\n        if raw_handle.is_null() {\n            return Err(EngineError::EngineStart(format!(\n                \"unable to create the engine job object: {}\",\n                std::io::Error::last_os_error()\n            )));\n        }\n\n        let job = Self {\n            handle: unsafe { OwnedHandle::from_raw_handle(raw_handle) },\n        };\n        let mut limits: JobObjectExtendedLimitInformation = unsafe { std::mem::zeroed() };\n        limits.basic_limit_information.limit_flags = JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE;\n        let configured = unsafe {\n            SetInformationJobObject(\n                job.handle.as_raw_handle(),\n                JOB_OBJECT_EXTENDED_LIMIT_INFORMATION_CLASS,\n                std::ptr::from_ref(&limits).cast(),\n                std::mem::size_of::<JobObjectExtendedLimitInformation>() as u32,\n            )\n        };\n        if configured == 0 {\n            return Err(EngineError::EngineStart(format!(\n                \"unable to configure the engine job object: {}\",\n                std::io::Error::last_os_error()\n            )));\n        }\n        Ok(job)\n    }\n\n    fn assign(&self, child: &Child) -> Result<(), EngineError> {\n        let assigned = unsafe {\n            AssignProcessToJobObject(self.handle.as_raw_handle(), child.as_raw_handle())\n        };\n        if assigned == 0 {\n            return Err(EngineError::EngineStart(format!(\n                \"unable to attach the bundled engine to its job object: {}\",\n                std::io::Error::last_os_error()\n            )));\n        }\n        Ok(())\n    }\n}\n\npub(crate) struct ManagedEngine {\n    executable: PathBuf,\n    instance_name: String,\n    _job: Option<JobObject>,\n    child: Option<Child>,\n}\n",
          )

          replace_once(
              "        let child = spawn_engine_without_waiting_for_index(\n            &executable,\n            &instance_name,\n            &config,\n            &database,\n        )?;\n        Ok(Self {\n            executable,\n            instance_name,\n            child: Some(child),\n        })\n",
              "        let job = JobObject::kill_on_close()?;\n        let mut child = spawn_engine_without_waiting_for_index(\n            &executable,\n            &instance_name,\n            &config,\n            &database,\n        )?;\n        if let Err(error) = job.assign(&child) {\n            let _ = child.kill();\n            let _ = child.wait();\n            return Err(error);\n        }\n        Ok(Self {\n            executable,\n            instance_name,\n            _job: Some(job),\n            child: Some(child),\n        })\n",
          )

          replace_once(
              "        Self {\n            executable,\n            instance_name,\n            child: None,\n        }\n",
              "        Self {\n            executable,\n            instance_name,\n            _job: None,\n            child: None,\n        }\n",
          )

          path.write_text(text, encoding="utf-8", newline="")
      - run: cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/everything-core/src/bundled_engine.rs
          git diff --cached --check
          git commit -m "fix: terminate bundled engine with the app"
          git push origin HEAD:chore/rename-everything-next
