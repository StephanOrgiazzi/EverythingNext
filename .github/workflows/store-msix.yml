name: Microsoft Store MSIX

on:
  pull_request:
    paths:
      - ".github/workflows/store-msix.yml"
      - "packaging/msix/**"
      - "scripts/build-msix.ps1"
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Trunk.toml"
      - "assets/icon.png"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from src-tauri/tauri.conf.json (for example 0.9.1)"
        required: true
        type: string
      without_service:
        description: "Omit the packaged Everything Windows service"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate Store release ref
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $expectedTag = "v${{ inputs.version }}"
          if ($env:GITHUB_REF_TYPE -ne "tag" -or $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Microsoft Store builds must run from release tag '$expectedTag' (selected ref: '$env:GITHUB_REF_NAME')."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Store release tag '$expectedTag' must point to a commit on master."
          }

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"

      - name: Prepare toolchain and bundled Everything runtime
        shell: pwsh
        run: .\scripts\setup.ps1 -SkipFormat

      - name: Build unsigned Store MSIX package
        shell: pwsh
        env:
          # Pull requests use harmless placeholders to validate the package layout.
          # Manual Store builds use the exact values copied from Partner Center.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'EverythingNext' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Everything Next' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Stephan Orgiazzi' }}
        run: |
          $arguments = @()
          if ('${{ inputs.version }}') {
            $arguments += @('-Version', '${{ inputs.version }}')
          }
          if ('${{ inputs.without_service }}' -eq 'true') {
            $arguments += '-WithoutService'
          }
          & .\scripts\build-msix.ps1 @arguments

      - name: Upload MSIX package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: everything-next-msix-${{ inputs.version }}
          path: artifacts/msix/*.msix
          if-no-files-found: error
